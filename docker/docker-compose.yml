services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: portfolio_app
    environment:
      NODE_ENV: production
      PORT: 4545
      DATABASE_URL: "file:/app/prisma/dev.db"
    ports:
      - "4545:4545"
    volumes:
      - ../prisma:/app/prisma
    restart: unless-stopped
